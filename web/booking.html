<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IPL Ticket Booking Form</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <h1>IPL Ticket Booking</h1>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="index.html#my-bookings">My Bookings</a></li>
        </ul>
    </nav>

</header>


<section>

    <h2>Book Your Ticket</h2>

    <form id="bookingForm">

        <label for="name">Name:</label>

        <input type="text"
               id="name"
               name="name"
               placeholder="Enter your name"
               minlength="3"
               maxlength="30"
               required>

        <br><br>


        <label for="email">Email:</label>

        <input type="email"
               id="email"
               name="email"
               placeholder="Enter your email"
               required>

        <br><br>


        <label for="phone">Phone Number:</label>

        <input type="tel"
               id="phone"
               name="phone"
               placeholder="Enter phone number"
               pattern="[0-9]{10}"
               required>

        <br><br>


        <label for="match">Select Match:</label>

        <select id="match" name="match" required>

            <option value="">Choose Match</option>

            <option value="CSK vs MI">
                CSK vs MI
            </option>

            <option value="RCB vs KKR">
                RCB vs KKR
            </option>

            <option value="DC vs SRH">
                DC vs SRH
            </option>

        </select>

        <br><br>


        <label for="stand">Stand Category:</label>

        <select id="stand" name="stand" required>

            <option value="">Choose Stand</option>

            <option value="General" data-price="1500">
                General - Rs. 1500
            </option>

            <option value="Premium" data-price="3500">
                Premium - Rs. 3500
            </option>

            <option value="VIP" data-price="7500">
                VIP - Rs. 7500
            </option>

        </select>

        <br><br>


        <label for="quantity">Number of Tickets:</label>

        <input type="number"
               id="quantity"
               name="quantity"
               min="1"
               max="10"
               value="1"
               required>

        <br><br>


        <label for="payment">Payment Preference:</label>

        <select id="payment" name="payment" required>

            <option value="">Select Payment</option>

            <option value="UPI">UPI</option>

            <option value="Card">Card</option>

        </select>

        <br><br>


        <input type="checkbox" id="agreement" required>

        <label for="agreement">
            I agree to the booking guidelines.
        </label>

        <br><br>


        <button type="submit">Confirm Booking</button>

        <button type="reset">Reset</button>

    </form>


    <div class="summary-card">

        <h2>Booking Summary</h2>

        <p>
            Match:
            <span id="summary-match">Not selected</span>
        </p>

        <p>
            Stand:
            <span id="summary-stand">Not selected</span>
        </p>

        <p>
            Ticket Price: Rs.
            <span id="summary-price">0</span>
        </p>

        <p>
            Quantity:
            <span id="summary-quantity">0</span>
        </p>

        <h3>
            Total Amount: Rs.
            <span id="summary-total">0</span>
        </h3>

    </div>

</section>


<footer>

    <p>Copyright © 2026 IPL Ticket Booking</p>

</footer>


<script src="app.js"></script>

</body>
</html>
