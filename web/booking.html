
<!DOCTYPE html>
<html>
<head>
    <title>IPL Ticket Booking Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h1>IPL Ticket Booking</h1>
</header>

<section>
    <h2>Book Your Ticket</h2>

    <form action="#" method="get">

        <label>Name:</label>
        <input type="text" name="name"
        placeholder="Enter your name"
        minlength="3" maxlength="30" required>

        <br><br>

        <label>Email:</label>
        <input type="email" name="email"
        placeholder="Enter your email" required>

        <br><br>

        <label>Phone Number:</label>
        <input type="tel" name="phone"
        placeholder="Enter phone number"
        pattern="[0-9]{10}" required>

        <br><br>

        <label>Select Match:</label>
        <select name="match" required>
            <option value="">Choose Match</option>
            <option>CSK vs MI</option>
            <option>RCB vs KKR</option>
            <option>DC vs SRH</option>
        </select>

        <br><br>

        <label>Stand Category:</label>
        <select name="stand" required>
            <option>General</option>
            <option>Premium</option>
            <option>VIP</option>
        </select>

        <br><br>

        <label>Number of Tickets:</label>
        <input type="number" name="tickets"
        min="1" max="10" required>

        <br><br>

        <label>Payment Preference:</label><br>
        <input type="radio" name="payment" value="UPI" required> UPI
        <input type="radio" name="payment" value="Card"> Card

        <br><br>

        <input type="checkbox" required>
        I agree to the booking guidelines.

        <br><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>

    </form>
</section>

<footer>
    <p>Copyright © 2026 IPL Ticket Booking</p>
</footer>

</body>
</html>
